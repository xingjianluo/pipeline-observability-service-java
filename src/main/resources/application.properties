server.port=0

# ---- 流水线可观测服务配置 ----
# 新鲜度阈值（毫秒）：距最近一次成功超过该时长视为 stale（默认 1 小时）
pipeline.observability.freshness-threshold-ms=3600000
# SLA 阈值（毫秒）：单次运行 STARTED -> 终态超过该时长视为延迟完成（默认 30 分钟）
pipeline.observability.sla-threshold-ms=1800000
# 连续失败/超时告警阈值（次）
pipeline.observability.consecutive-failure-threshold=3
# 告警抑制窗口（毫秒）：同一问题在窗口内只提醒一次（默认 30 分钟）
pipeline.observability.alert-suppression-window-ms=1800000
# 定时巡检间隔（毫秒），驱动"长时间没有成功"告警
pipeline.observability.scan-interval-ms=60000
pipeline.observability.scan-initial-delay-ms=10000
# JSON 持久化目录（重启后从这里恢复）
pipeline.observability.storage-dir=data/observability
