server.port=0
observability.storage-dir=${java.io.tmpdir}/pipeline-observability-${random.uuid}
observability.default-freshness-threshold=30s
observability.default-sla=60s
observability.default-failure-alert-threshold=3
observability.default-suppress-window=15s
observability.monitor-enabled=true
observability.monitor-interval=30s
